name: Demergi Windows Direct Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/demergi-ab-test.yml"
      - "docs/demergi-ab-test.md"
      - "scripts/demergi-ab-test/**"
      - "scripts/linux_do_stable_full.tar.gz"

permissions:
  contents: read

concurrency:
  group: demergi-ab-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    name: Build Windows x64 Demergi package
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extract Demergi source package
        shell: bash
        run: |
          rm -rf .demergi-work
          mkdir -p .demergi-work
          tar --exclude='*/node_modules' -xzf scripts/linux_do_stable_full.tar.gz -C .demergi-work

      - name: Apply connection cleanup fix
        shell: bash
        run: |
          git apply --check --directory=.demergi-work/linux_do_proxy/demergi scripts/demergi-ab-test/patches/socket-cleanup.patch
          git apply --directory=.demergi-work/linux_do_proxy/demergi scripts/demergi-ab-test/patches/socket-cleanup.patch

      - name: Test connection cleanup and CONNECT relay
        shell: bash
        timeout-minutes: 2
        run: node --test scripts/demergi-ab-test/tests/socket-cleanup.test.mjs

      - name: Build Demergi Windows binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $demergiDir = Join-Path $PWD ".demergi-work\linux_do_proxy\demergi"
          Push-Location $demergiDir
          npm install --no-audit --no-fund --package-lock=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to install dependencies." }
          npm run build:bundle
          if ($LASTEXITCODE -ne 0) { throw "Failed to bundle Demergi." }
          npx --no-install pkg --target node20-win-x64 --out-path ./dist/ ./dist/demergi.js
          if ($LASTEXITCODE -ne 0) { throw "Failed to package Demergi." }
          Pop-Location
          Get-ChildItem -Path (Join-Path $demergiDir "dist") -Force

      - name: Prepare direct-use artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "dist\demergi-direct"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $demergiDist = Join-Path $PWD ".demergi-work\linux_do_proxy\demergi\dist"
          $demergiExe = Get-ChildItem -Path $demergiDist -Filter "*.exe" -File | Select-Object -First 1
          if (-not $demergiExe) {
            throw "Demergi Windows executable was not produced under $demergiDist"
          }
          Copy-Item -LiteralPath $demergiExe.FullName -Destination (Join-Path $out "demergi.exe")

          Copy-Item -LiteralPath "scripts\demergi-ab-test\start-demergi-windows.ps1" -Destination $out
          Copy-Item -LiteralPath "scripts\demergi-ab-test\stop-demergi-windows.ps1" -Destination $out
          Copy-Item -LiteralPath "scripts\demergi-ab-test\run-demergi-chrome.ps1" -Destination $out
          Copy-Item -LiteralPath "scripts\demergi-ab-test\run-demergi-normal-chrome.ps1" -Destination $out
          Copy-Item -LiteralPath "scripts\demergi-ab-test\run-demergi-normal-chrome-silent.cmd" -Destination $out
          Copy-Item -LiteralPath "scripts\demergi-ab-test\open-demergi-chrome.ps1" -Destination $out
          Copy-Item -LiteralPath "scripts\demergi-ab-test\status-demergi-windows.ps1" -Destination $out
          Copy-Item -LiteralPath "scripts\demergi-ab-test\linuxdo-demergi.pac" -Destination $out
          Copy-Item -LiteralPath "scripts\linuxdo_dpi_overrides.json" -Destination $out
          Copy-Item -LiteralPath "scripts\demergi-ab-test\stop-demergi-silent.cmd" -Destination $out
          Copy-Item -LiteralPath "docs\demergi-ab-test.md" -Destination (Join-Path $out "readme.md")

          $cscCandidates = @(
            "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe",
            "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          )
          $csc = $cscCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $csc) {
            throw "The .NET Framework C# compiler csc.exe was not found."
          }
          $launcherSource = Join-Path $PWD "scripts\demergi-ab-test\DemergiSilentLauncher.cs"
          $startLauncher = Join-Path $out "run-demergi-normal-chrome-silent.exe"
          $stopLauncher = Join-Path $out "stop-demergi-silent.exe"
          & $csc /nologo /target:winexe /optimize+ /platform:anycpu "/out:$startLauncher" $launcherSource
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to compile Demergi silent launcher."
          }
          Copy-Item -LiteralPath $startLauncher -Destination $stopLauncher

          @(
            "Linux.do Demergi direct-use package"
            "Repository: $env:GITHUB_REPOSITORY"
            "Branch: $env:GITHUB_REF_NAME"
            "Commit: $env:GITHUB_SHA"
            "Run: $env:GITHUB_RUN_ID"
            "Built at: $((Get-Date).ToUniversalTime().ToString('u'))"
          ) | Set-Content -Path (Join-Path $out "BUILD-INFO.txt") -Encoding ASCII

      - name: Upload direct-use artifact
        uses: actions/upload-artifact@v4
        with:
          name: linuxdo-demergi-direct-windows-x64-${{ github.run_number }}
          path: dist/demergi-direct/**
